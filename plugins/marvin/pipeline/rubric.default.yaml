version: 1
tiers:
  light: { max_files: 5, risk: [low] }
  heavy: { min_files: 16, risk: [high] }
# "<model>/<effort>"; only the test-author may be "skip"
#
# No role runs above effort high. Over 106 runs (2026-10-13 to 2026-11-23) xhigh was 48% of the
# spend, a heavy planner on xhigh cost 2.8x and took 3x as long as one on high with more rejections
# downstream, not fewer, and an executor raised to sonnet/xhigh had 2 of 17 fixes accepted against
# 6 of 16 on opus. Past high the lever is the model, so the ladder switches model and never raises
# effort; in heavy, where the executor already runs on opus, its second step is a plain retry.
assignments:
  light:
    planner: opus/medium
    test-author: skip
    executor: sonnet/medium
    verifier: sonnet/high
    retro: sonnet/medium
  standard:
    planner: opus/high
    test-author: opus/medium
    executor: sonnet/high
    verifier: opus/high
    retro: opus/medium
  heavy:
    planner: opus/high
    test-author: opus/medium
    executor: opus/high
    verifier: opus/high
    retro: opus/medium
escalation: [model:opus, model:opus, halt]
caps:
  rejections: 3
  planner_questions: 8
  test_author_attempts: 2
  child_retries: 1
  limit_retries: 3 # waits a child gets after a usage limit before the run halts; its own count
  limit_wait_minutes: 30 # the wait when the limit message names no reset time
  launch_retries: 3 # relaunches of a child that never got to work (an expired login, a provider outage), 1, 2 then 4 minutes apart; its own count
  bookkeeping_rejections: 2 # rejections over the pipeline's own service files alone (a committed journal or receipt) that move no escalation rung and do not count against `rejections`
  dor_rounds: 2 # resumes a planner gets to fix a spec the DoR gate fails; its own count
  ci_wait_minutes: 60
  executor_questions: 3
  spec_critic: { light: 1, default: 2 }
sensitive_paths: [] # JS regexes over repo-relative paths
cross_repo_markers: [] # JS regexes over the spec text
slicing: { enabled: false, min_criteria: 6, min_files: 10 }
